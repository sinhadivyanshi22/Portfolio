<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00D9FF" />

    <!-- Google Fonts Preconnect and Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- SEO Meta Tags -->
    <title>Divyanshi Sinha</title>
    <meta name="description" content="Explore Rocky's developer portfolio featuring modern web apps, full stack systems, LeetCode competitive programming, and GitHub dashboard integration." />
    <meta name="keywords" content="Rocky, Portfolio, Full Stack Developer, React, Node.js, Spring Boot, Java, LeetCode, GitHub" />
    <meta name="author" content="Rocky" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rocky-portfolio.vercel.app/" />
    <meta property="og:title" content="Rocky | Premium Full Stack Developer Portfolio" />
    <meta property="og:description" content="Explore Rocky's developer portfolio featuring modern web apps, full stack systems, LeetCode stats, and GitHub integrations." />
    <meta property="og:image" content="https://rocky-portfolio.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://rocky-portfolio.vercel.app/" />
    <meta property="twitter:title" content="Rocky | Premium Full Stack Developer Portfolio" />
    <meta property="twitter:description" content="Explore Rocky's developer portfolio featuring modern web apps, full stack systems, LeetCode stats, and GitHub integrations." />
    <meta property="twitter:image" content="https://rocky-portfolio.vercel.app/og-image.jpg" />

    <!-- Structured JSON-LD Metadata -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rocky",
        "jobTitle": "Full Stack Software Engineer",
        "url": "https://rocky-portfolio.vercel.app/",
        "sameAs": [
          "https://github.com/rocky",
          "https://linkedin.com/in/rocky",
          "https://leetcode.com/rocky"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
